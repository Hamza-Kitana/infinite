      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#yk-bg)"/>
  <rect width="1600" height="560" fill="url(#yk-stripes)"/>
  <!-- skyline hint -->
  <path fill="#000000" opacity="0.35" d="M0 420 L120 340 L200 380 L280 300 L360 360 L440 280 L520 340 L600 260 L680 400 L760 320 L840 380 L920 300 L1000 360 L1080 280 L1160 340 L1240 300 L1320 380 L1400 320 L1480 360 L1560 300 L1600 340 L1600 560 L0 560 Z"/>
  <rect width="1600" height="560" fill="url(#yk-vignette)"/>
