      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="55%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <pattern id="yk-stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="20" height="40" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <linearGradient id="yk-vignette" x1="50%" y1="0%" x2="50%" y2="100%">
