  <g transform="translate(1180 120)" opacity="0.9">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FECACA" stroke-width="4" opacity="0.8"/>
    <rect x="-36" y="-36" width="72" height="72" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5" transform="rotate(45)"/>
  </g>
  <text x="80" y="160" fill="#FCA5A5" font-family="Impact, Arial Black, sans-serif" font-size="72" letter-spacing="0.08em">YAKUZA</text>
  <text x="80" y="230" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="28" opacity="0.85">'DJ'CH2'  .7 #-E1 ù GJ() 'D4'19</text>
  <text x="80" y="480" fill="#FECACA" font-family="Impact, Arial Black, sans-serif" font-size="52" letter-spacing="0.15em" opacity="0.35">RED TERRITORY</text>
