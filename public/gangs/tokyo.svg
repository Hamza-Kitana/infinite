<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tk-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tk-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tk-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="560" fill="url(#tk-bg)"/>
  <rect width="1600" height="560" fill="url(#tk-grid)"/>
  <!-- white spotlight band -->
  <ellipse cx="800" cy="280" rx="520" ry="200" fill="#FFFFFF" opacity="0.08"/>
  <rect x="0" y="200" width="1600" height="6" fill="url(#tk-neon)" opacity="0.7"/>
  <rect x="0" y="380" width="1600" height="3" fill="#FFFFFF" opacity="0.15"/>
  <path fill="#000000" opacity="0.5" d="M0 440 L100 400 L200 430 L300 380 L400 420 L500 360 L600 400 L700 350 L800 410 L900 370 L1000 420 L1100 380 L1200 430 L1300 390 L1400 420 L1500 400 L1600 430 L1600 560 L0 560 Z"/>
  <text x="80" y="150" fill="#FFFFFF" font-family="Impact, Arial Black, sans-serif" font-size="76" letter-spacing="0.06em">TOKYO CREW</text>
  <text x="80" y="215" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="26" opacity="0.9">*HCJH  6H! 'DDJD · #(J6 9DI #3H/</text>
  <text x="80" y="470" fill="#FFFFFF" font-family="Impact, Arial Black, sans-serif" font-size="48" letter-spacing="0.2em" opacity="0.25">NEON DISTRICT</text>
